<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<title>吃子连三</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@700;900&display=swap">
<style>
/* Layout: the board is the hero on the left, a narrow control column on the right; stacks to one column under 780px.
   Palette: a celadon tabletop with ivory and ink stones; gold marks selection and the winning line. */
:root {
  --bg: #e7ece8;
  --surface: #f6f8f5;
  --fg: #17201c;
  --muted: #56655d;
  --rule: #cdd7d0;
  --board: #3f6e5e;
  --well: #34604f;
  --well-shade: #26493c;
  --stone-w: #f3eee1;
  --stone-w-hi: #ffffff;
  --stone-w-lo: #d4ccb6;
  --stone-w-ink: #1e1b16;
  --stone-b: #1d2321;
  --stone-b-hi: #4a5450;
  --stone-b-lo: #0a0d0c;
  --stone-b-ink: #efe8d6;
  --gold: #c99418;
  --win: #1f7f53;
  --draw: #6b7681;
  --lose: #b8382a;
  --on-sem: #ffffff;
  --shadow: rgba(10, 20, 15, 0.28);
  --font-display: "Ma Shan Zheng", "STKaiti", "KaiTi", "Kaiti SC", serif;
  --font-body: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  --font-num: "Noto Serif SC", "Songti SC", "SimSun", Georgia, serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1412; --surface: #171f1b; --fg: #e3eae5; --muted: #98a79f; --rule: #2a3631;
    --board: #2b5044; --well: #223f35; --well-shade: #142921;
    --stone-b-hi: #56625d; --stone-b: #202724; --gold: #e2b03c; --win: #2f9a68; --draw: #7d8893; --lose: #d4523f;
    --shadow: rgba(0, 0, 0, 0.5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1412; --surface: #171f1b; --fg: #e3eae5; --muted: #98a79f; --rule: #2a3631;
  --board: #2b5044; --well: #223f35; --well-shade: #142921;
  --stone-b-hi: #56625d; --stone-b: #202724; --gold: #e2b03c; --win: #2f9a68; --draw: #7d8893; --lose: #d4523f;
  --shadow: rgba(0, 0, 0, 0.5); color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body {
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 48px;
}
.wrap { max-width: 1040px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; }
header .lang { margin-left: auto; align-self: center; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(40px, 7vw, 60px); line-height: 1; margin: 0; letter-spacing: 0.04em; }
.tag { color: var(--muted); font-size: 14px; letter-spacing: 0.08em; }
.game { display: grid; grid-template-columns: minmax(0, 480px) minmax(0, 1fr); gap: 32px; align-items: start; }
@media (max-width: 780px) { .game { grid-template-columns: minmax(0, 1fr); } }

/* Board */
.board-col { display: grid; gap: 14px; min-width: 0; }
.status { font-size: 18px; font-weight: 500; min-height: 1.6em; margin: 0; text-wrap: balance; }
.status .who { font-weight: 700; }
.msg { color: var(--lose); font-size: 14px; min-height: 1.5em; margin: 0; }
.board {
  position: relative; width: 100%; max-width: 480px; aspect-ratio: 1;
  background: var(--board); border-radius: 20px; padding: 3.2%;
  display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 2.6%;
  box-shadow: 0 22px 44px -24px var(--shadow), inset 0 1px 0 rgba(255,255,255,0.08);
}
.cell {
  position: relative; min-width: 0; min-height: 0; border: 0; padding: 0; margin: 0; border-radius: 14px;
  background: var(--well); box-shadow: inset 0 4px 10px var(--well-shade);
  display: grid; place-items: center; cursor: default; container-type: size; font: inherit; color: inherit;
}
.cell:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.cell.act { cursor: pointer; }
.stone {
  width: 78%; aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center;
  font-family: var(--font-num); font-weight: 900; font-size: 30px; font-size: 44cqmin; line-height: 1;
  user-select: none; transition: transform 0.15s ease, box-shadow 0.15s ease;
}
.stone.w { background: radial-gradient(circle at 34% 28%, var(--stone-w-hi) 0%, var(--stone-w) 42%, var(--stone-w-lo) 100%); color: var(--stone-w-ink); box-shadow: 0 5px 0 rgba(0,0,0,0.16), 0 10px 16px var(--shadow); }
.stone.b { background: radial-gradient(circle at 34% 28%, var(--stone-b-hi) 0%, var(--stone-b) 45%, var(--stone-b-lo) 100%); color: var(--stone-b-ink); box-shadow: 0 5px 0 rgba(0,0,0,0.3), 0 10px 16px var(--shadow); }
.stone.new { animation: drop 0.22s ease-out; }
@keyframes drop { from { transform: scale(1.25); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.ghost { opacity: 0; transition: opacity 0.12s; pointer-events: none; }
.cell.act:hover .ghost, .cell.act:focus-visible .ghost { opacity: 0.42; }
.cell.sel .stone { box-shadow: 0 0 0 4px var(--gold), 0 10px 16px var(--shadow); transform: translateY(-3px); }
.cell.target .stone { box-shadow: 0 0 0 4px var(--lose), 0 10px 16px var(--shadow); }
.cell.target:hover .stone { transform: scale(0.94); }
.cell.armed::after { content: ""; position: absolute; top: 9%; right: 9%; width: 9%; aspect-ratio: 1; border-radius: 50%; background: var(--gold); }
.cell.last::before { content: ""; position: absolute; inset: 5%; border-radius: 10px; border: 2px solid var(--gold); opacity: 0.75; pointer-events: none; }
.cell.gone .stone { animation: gone 0.3s ease-in forwards; }
@keyframes gone { to { transform: scale(0.4); opacity: 0; } }
.hint {
  position: absolute; left: 6%; top: 6%; z-index: 2; font-size: 12px; font-weight: 700; line-height: 1;
  padding: 4px 6px; border-radius: 6px; color: var(--on-sem); pointer-events: none; letter-spacing: 0.05em;
}
.hint.win { background: var(--win); } .hint.draw { background: var(--draw); } .hint.lose { background: var(--lose); }
.winline { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
.winline line { stroke: var(--gold); stroke-width: 10; stroke-linecap: round; opacity: 0.9; }
.coords { color: var(--muted); font-size: 13px; margin: 0; }

/* Side panel */
.side { display: grid; gap: 22px; min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; padding: 16px 18px; display: grid; gap: 14px; }
.label { font-size: 12px; letter-spacing: 0.12em; color: var(--muted); margin: 0; }
.hands { display: grid; gap: 12px; }
.hand { display: grid; grid-template-columns: max-content minmax(0, 1fr); align-items: center; gap: 12px; }
.hand .who-col { display: grid; gap: 0; }
.hand .name { font-weight: 500; font-size: 14px; white-space: nowrap; }
.hand.turn .name::before { content: "▸ "; color: var(--gold); }
.pips { display: flex; gap: 6px; flex-wrap: wrap; }
.pip { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-num); font-weight: 900; font-size: 14px; line-height: 1; }
.pip.w { background: var(--stone-w); color: var(--stone-w-ink); box-shadow: inset 0 0 0 1px var(--stone-w-lo); }
.pip.b { background: var(--stone-b); color: var(--stone-b-ink); box-shadow: inset 0 0 0 1px var(--stone-b-hi); }
.pip.used { opacity: 0.22; }
.pip.next { outline: 2px solid var(--gold); outline-offset: 2px; }
.lost { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.field { display: grid; gap: 6px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label { border: 1px solid var(--rule); border-radius: 999px; padding: 5px 12px; font-size: 13.5px; cursor: pointer; background: var(--bg); }
.seg input:checked + label { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.seg input:focus-visible + label { outline: 2px solid var(--gold); outline-offset: 2px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
button.btn { font: inherit; font-size: 14px; border-radius: 10px; padding: 7px 14px; border: 1px solid var(--rule); background: var(--bg); color: var(--fg); cursor: pointer; }
button.btn.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
button.btn:disabled { opacity: 0.4; cursor: not-allowed; }
button.btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
.toggle input { width: 16px; height: 16px; accent-color: var(--win); }
.eval { font-size: 13.5px; color: var(--muted); margin: 0; }
.eval b { color: var(--fg); }
.legend { display: flex; flex-wrap: wrap; gap: 8px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 4px; }
.legend i { font-style: normal; color: var(--on-sem); border-radius: 4px; padding: 2px 5px; font-weight: 700; }
.log { margin: 0; padding-left: 2.4em; max-height: 220px; overflow-y: auto; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.log li { padding: 1px 0; }
.log li.pass { color: var(--muted); }
.log:empty::before { content: attr(data-empty); color: var(--muted); margin-left: -2.4em; }

/* Rules */
.rules { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 300px); gap: 28px; border-top: 1px solid var(--rule); padding-top: 24px; }
@media (max-width: 780px) { .rules { grid-template-columns: minmax(0, 1fr); } }
.rules h2 { font-family: var(--font-display); font-weight: 400; font-size: 30px; margin: 0 0 8px; letter-spacing: 0.04em; }
.rules ol { margin: 0; padding-left: 1.5em; display: grid; gap: 4px; max-width: 62ch; }
.rules ol b { font-weight: 700; }
.facts { display: grid; gap: 10px; align-content: start; }
.verdict { font-size: 15px; margin: 0; }
.verdict b { display: block; font-size: 22px; font-family: var(--font-num); font-weight: 900; }
.facts p { margin: 0; font-size: 13.5px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) {
  .stone, .stone.new, .cell.gone .stone { animation: none !important; transition: none !important; }
}
</style>

<div class="wrap">
  <header>
    <h1>吃子连三</h1>
    <span class="tag" data-i18n="tag"></span>
    <button class="btn lang" id="btn-lang" type="button"></button>
  </header>

  <div class="game">
    <div class="board-col">
      <p class="status" id="status" aria-live="polite"></p>
      <div class="board" id="board" role="grid" data-i18n-aria="board"></div>
      <p class="msg" id="msg" aria-live="polite"></p>
      <p class="coords" data-i18n="howto"></p>
    </div>

    <div class="side">
      <section class="panel" data-i18n-aria="order">
        <p class="label" data-i18n="order"></p>
        <div class="hands" id="hands"></div>
      </section>

      <section class="panel" data-i18n-aria="settings">
        <div class="field">
          <p class="label" data-i18n="rules"></p>
          <div class="seg" id="rule-seg">
            <input type="radio" name="rule" id="rule-A" value="A"><label for="rule-A" data-i18n="ruleA"></label>
            <input type="radio" name="rule" id="rule-B" value="B"><label for="rule-B" data-i18n="ruleB"></label>
            <input type="radio" name="rule" id="rule-O" value="O"><label for="rule-O" data-i18n="ruleO"></label>
          </div>
        </div>
        <div class="field">
          <p class="label" data-i18n="youPlay"></p>
          <div class="seg" id="side-seg">
            <input type="radio" name="side" id="side-0" value="0"><label for="side-0" data-i18n="sideW"></label>
            <input type="radio" name="side" id="side-1" value="1"><label for="side-1" data-i18n="sideB"></label>
          </div>
        </div>
        <div class="row">
          <button class="btn primary" id="btn-new" type="button" data-i18n="newGame"></button>
          <button class="btn" id="btn-undo" type="button" data-i18n="undo"></button>
          <label class="toggle"><input type="checkbox" id="hint-toggle"><span data-i18n="showHints"></span></label>
        </div>
        <p class="eval" id="eval" hidden></p>
        <div class="legend" id="legend" hidden>
          <span><i style="background:var(--win)" data-i18n="tWin"></i><span data-i18n="legWin"></span></span>
          <span><i style="background:var(--draw)" data-i18n="tDraw"></i><span data-i18n="legDraw"></span></span>
          <span><i style="background:var(--lose)" data-i18n="tLose"></i><span data-i18n="legLose"></span></span>
        </div>
      </section>

      <section class="panel" data-i18n-aria="moves">
        <p class="label" data-i18n="moves"></p>
        <ol class="log" id="log"></ol>
      </section>
    </div>
  </div>

  <section class="rules" data-i18n-aria="rulesAria">
    <div>
      <h2 id="rules-title"></h2>
      <ol id="rules-list"></ol>
    </div>
    <div class="facts">
      <p class="verdict" id="verdict"></p>
      <p id="facts"></p>
    </div>
  </section>
</div>

<script>
function makeEngine(cfg) {
  "use strict";
  const ORDER = cfg.order === "asc" ? [1, 1, 2, 2, 3, 3] : [3, 3, 2, 2, 1, 1];
  const LINES = [0,1,2, 3,4,5, 6,7,8, 0,3,6, 1,4,7, 2,5,8, 0,4,8, 2,4,6];
  const NB = [];
  for (let i = 0; i < 9; i++) {
    const r = (i / 3) | 0, c = i % 3, l = [];
    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
      if (!dr && !dc) continue;
      if (!cfg.diag && dr && dc) continue;
      const rr = r + dr, cc = c + dc;
      if (rr >= 0 && rr < 3 && cc >= 0 && cc < 3) l.push(rr * 3 + cc);
    }
    NB.push(l);
  }
  function beats(a, b) {
    if (cfg.cyclic) { if (a === 1 && b === 3) return true; if (a === 3 && b === 1) return false; }
    return a > b;
  }
  function gen(b, k, p, out) {
    const s = p === 0 ? 1 : -1; let n = 0;
    if (k[p] < 6) for (let i = 0; i < 9; i++) if (b[i] === 0) out[n++] = i;
    for (let i = 0; i < 9; i++) {
      const x = b[i] * s;
      if (x > 0) {
        const nb = NB[i];
        for (let t = 0; t < nb.length; t++) {
          const j = nb[t], y = b[j] * s;
          if (y < 0 && beats(x, -y)) out[n++] = 100 + i * 9 + j;
        }
      }
    }
    return n;
  }
  function wonLine(b, p) {
    const s = p === 0 ? 1 : -1;
    for (let t = 0; t < 24; t += 3) {
      if (b[LINES[t]] * s > 0 && b[LINES[t + 1]] * s > 0 && b[LINES[t + 2]] * s > 0) return [LINES[t], LINES[t + 1], LINES[t + 2]];
    }
    return null;
  }
  function won(b, p) {
    const s = p === 0 ? 1 : -1;
    for (let t = 0; t < 24; t += 3) if (b[LINES[t]] * s > 0 && b[LINES[t + 1]] * s > 0 && b[LINES[t + 2]] * s > 0) return true;
    return false;
  }
  function applyM(b, k, p, m) {
    if (m < 100) { b[m] = (p === 0 ? 1 : -1) * ORDER[k[p]]; k[p]++; return 0; }
    const f = ((m - 100) / 9) | 0, t = (m - 100) % 9, a = b[f], vic = b[t];
    if (cfg.stay) b[t] = 0; else { b[t] = a; b[f] = 0; }
    return (a + 3) * 7 + (vic + 3);
  }
  function undoM(b, k, p, m, u) {
    if (m < 100) { b[m] = 0; k[p]--; return; }
    const f = ((m - 100) / 9) | 0, t = (m - 100) % 9;
    b[f] = ((u / 7) | 0) - 3; b[t] = (u % 7) - 3;
  }
  function keyOf(b, k, p) {
    let h = 0;
    for (let i = 0; i < 9; i++) h = h * 7 + (b[i] + 3);
    return ((h * 49 + k[0] * 7 + k[1]) * 2 + p) + 1;
  }
  function table(bits) {
    const size = 1 << bits, mask = size - 1, shift = 32 - bits;
    const keys = new Uint32Array(size), vals = new Int16Array(size);
    let used = 0;
    return {
      get(key) {
        let i = Math.imul(key, 0x9E3779B1) >>> shift;
        while (true) { const x = keys[i]; if (x === 0) return 999; if (x === key) return vals[i]; i = (i + 1) & mask; }
      },
      put(key, v) {
        if (used > size * 0.7) { keys.fill(0); used = 0; }
        let i = Math.imul(key, 0x9E3779B1) >>> shift;
        while (keys[i] !== 0 && keys[i] !== key) i = (i + 1) & mask;
        if (keys[i] === 0) used++;
        keys[i] = key; vals[i] = v;
      },
      size() { return used; }
    };
  }
  const TV = table(23), TD = table(22);
  const stacks = [];
  for (let d = 0; d < 80; d++) stacks.push(new Int16Array(64));

  // Game value with White = +1, Black = -1, draw = 0. p is the side to move.
  function V(b, k, p, depth) {
    const key = keyOf(b, k, p);
    const c = TV.get(key);
    if (c !== 999) return c;
    const out = stacks[depth];
    const n = gen(b, k, p, out);
    let res;
    if (n === 0) {
      res = gen(b, k, 1 - p, stacks[depth + 1]) === 0 ? 0 : V(b, k, 1 - p, depth + 1);
    } else {
      const target = p === 0 ? 1 : -1;
      let best = p === 0 ? -2 : 2;
      for (let t = 0; t < n; t++) {
        const m = out[t], u = applyM(b, k, p, m);
        const v = won(b, p) ? target : V(b, k, 1 - p, depth + 1);
        undoM(b, k, p, m, u);
        if (p === 0 ? v > best : v < best) best = v;
        if (best === target) break;
      }
      res = best;
    }
    TV.put(key, res);
    return res;
  }
  // Plies until the winning side wins, winner hurrying and loser stalling. 999 when drawn.
  function D(b, k, p, depth) {
    const key = keyOf(b, k, p);
    const c = TD.get(key);
    if (c !== 999) return c;
    const v = V(b, k, p, depth);
    let res;
    if (v === 0) res = 900;
    else {
      const out = stacks[depth];
      const n = gen(b, k, p, out);
      if (n === 0) res = D(b, k, 1 - p, depth + 1);
      else {
        const winner = v === (p === 0 ? 1 : -1);
        let best = winner ? 900 : 0;
        for (let t = 0; t < n; t++) {
          const m = out[t], u = applyM(b, k, p, m);
          let d;
          if (won(b, p)) d = 1;
          else if (winner && V(b, k, 1 - p, depth + 1) !== v) d = -1;
          else d = 1 + D(b, k, 1 - p, depth + 1);
          undoM(b, k, p, m, u);
          if (d < 0) continue;
          if (winner ? d < best : d > best) best = d;
        }
        res = best;
      }
    }
    TD.put(key, res);
    return res;
  }

  const toB = (st) => Int8Array.from(st.b);
  function legal(st) {
    const out = new Int16Array(64);
    const n = gen(toB(st), st.k.slice(), st.p, out);
    return Array.from(out.subarray(0, n));
  }
  function next(st, m) {
    const b = Int8Array.from(st.b), k = st.k.slice(), p = st.p;
    applyM(b, k, p, m);
    const line = wonLine(b, p);
    return { st: { b: Array.from(b), k, p: 1 - p }, line };
  }
  function evalMoves(st) {
    const b = toB(st), k = st.k.slice(), p = st.p, out = new Int16Array(64);
    const n = gen(b, k, p, out), res = [];
    for (let t = 0; t < n; t++) {
      const m = out[t], u = applyM(b, k, p, m);
      const v = won(b, p) ? (p === 0 ? 1 : -1) : V(b, k, 1 - p, 1);
      undoM(b, k, p, m, u);
      res.push({ m, v });
    }
    return { value: V(b, k, p, 0), moves: res };
  }
  function choose(st) {
    const p = st.p, sg = p === 0 ? 1 : -1, b = toB(st), k = st.k.slice();
    const out = new Int16Array(64), n = gen(b, k, p, out), cands = [];
    for (let t = 0; t < n; t++) {
      const m = out[t], u = applyM(b, k, p, m);
      const imm = won(b, p);
      const v = imm ? sg : V(b, k, 1 - p, 1);
      cands.push({ m, s: v * sg, imm, b2: Int8Array.from(b), k2: k.slice() });

/* ---------- solver bridge: a Web Worker when possible, else the main thread ---------- */
const Solver = (() => {
  let worker = null, seq = 0, pending = new Map(), local = null, localKey = null;
  try {
    const src = makeEngine.toString() + `
      let E = null, key = null;
      onmessage = (e) => {
        const { id, cfg, task, st } = e.data;
        const k = JSON.stringify(cfg);
        if (k !== key) { E = makeEngine(cfg); key = k; }
        let res = null;
        if (task === "ai") res = E.choose(st);
        else if (task === "eval") res = E.evalMoves(st);
        postMessage({ id, res });
      };`;
    worker = new Worker(URL.createObjectURL(new Blob([src], { type: "text/javascript" })));
    worker.onmessage = (e) => { const p = pending.get(e.data.id); if (p) { pending.delete(e.data.id); p(e.data.res); } };
    worker.onerror = () => { worker = null; for (const [id, p] of pending) p(null); pending.clear(); };
  } catch (err) { worker = null; }
  function runLocal(cfg, task, st) {
    const k = JSON.stringify(cfg);
    if (k !== localKey) { local = makeEngine(cfg); localKey = k; }
    return task === "ai" ? local.choose(st) : local.evalMoves(st);
  }
  return {
    ask(cfg, task, st) {
      if (worker) {
        return new Promise((resolve) => {
          const id = ++seq;
          pending.set(id, (res) => resolve(res === null && !worker ? runLocal(cfg, task, st) : res));
          worker.postMessage({ id, cfg, task, st });
        });
      }
      return new Promise((resolve) => setTimeout(() => resolve(runLocal(cfg, task, st)), 30));
    },
  };
})();

function doMove(m) {

  const res = E.next(st, m);

  G.gone = d.place === undefined && RULESETS[G.rule].cfg.stay ? d.to : null;

function resolvePass() {
  if (G.over) return;

  const other = { b: G.st.b, k: G.st.k, p: 1 - G.st.p };
  if (!E.legal(other).length) { G.over = { winner: -1 }; return; }
  G.log.push({ pass: true, p: G.st.p });
  G.st = other;

function scheduleNext() {
  if (G.over) { render(); return; }
  const token = G.token;
  if (G.st.p !== G.human) {
    G.thinking = true; render();

    Solver.ask(RULESETS[G.rule].cfg, "ai", G.st).then((m) => {
      if (token !== G.token || m === null || m === undefined) return;
      setTimeout(() => {
        if (token !== G.token) return;
        G.thinking = false;
        doMove(m);
      }, Math.max(0, 480 - (performance.now() - t0)));
    });

    if (G.hint) {
      Solver.ask(RULESETS[G.rule].cfg, "eval", G.st).then((r) => {

  G.history.push(snapshot());

  if (!G.history.length) return;

  if (v * s > 0) {

      if (armed.has(i)) cls.push("armed", "act");
      if (G.sel === i) cls.push("sel");
      if (targets.has(i)) cls.push("target", "act");
      else if (myTurn && v * hs < 0 && legal.some((m) => m >= 100 && decode(m).to === i)) cls.push("act");
    } else if (G.gone === i && G.goneVal && anim) {
      inner = stoneHTML(G.goneVal, "");
      cls.push("gone");
    } else {
      label += `, ${T.empty}`;
      if (myTurn && nv !== null) { cls.push("act"); inner = `<span class="stone ghost ${human === 0 ? "w" : "b"}">${nv}</span>`; }
    }
    if (G.last === i) cls.push("last");
    if (badge[i] !== undefined) {
      const k = badge[i] > 0 ? "win" : badge[i] < 0 ? "lose" : "draw";
      inner += `<span class="hint ${k}">${badge[i] > 0 ? T.tWin : badge[i] < 0 ? T.tLose : T.tDraw}</span>`;
    }
    html += `<button type="button" class="${cls.join(" ")}" data-i="${i}" aria-label="${label}">${inner}</button>`;
  }
  if (G.over && G.over.line) html += `<svg class="winline" id="winline" aria-hidden="true"></svg>`;
  board.innerHTML = html;
  if (G.over && G.over.line) drawWinLine();

  // status
  const ai = 1 - human;
  let status;
  if (G.over) {
    if (G.over.winner === -1) status = T.stDraw;
    else if (G.over.winner === human) status = T.stYouWin(human);
    else status = T.stAiWin(ai);
  } else if (G.thinking) status = T.stThinking(ai);
  else if (nv !== null) status = T.stPlace(human, nv);
  else status = T.stCaptureOnly(human);
  $("status").innerHTML = status;
  $("msg").textContent = G.msg;

  // hands
  let hands = "";
  for (const p of [0, 1]) {
    const onBoard = st.b.filter((x) => (p === 0 ? x > 0 : x < 0)).length;
    const lost = st.k[p] - onBoard;
    const pips = E.ORDER.map((v, j) => `<span class="pip ${p === 0 ? "w" : "b"}${j < st.k[p] ? " used" : ""}${j === st.k[p] && !G.over ? " next" : ""}">${v}</span>`).join("");
    hands += `<div class="hand${!G.over && st.p === p ? " turn" : ""}"><span class="who-col"><span class="name">${T.sideName(p)} · ${p === human ? T.you : T.ai}</span><span class="lost">${T.lost(lost)}</span></span><span class="pips">${pips}</span></div>`;
  }
  $("hands").innerHTML = hands;

  // controls
  $("rule-" + G.rule).checked = true;
  $("side-" + G.human).checked = true;
  $("hint-toggle").checked = G.hint;
  $("btn-undo").disabled = !G.history.length || G.thinking;
  const ev = $("eval");
  ev.hidden = !G.hint; $("legend").hidden = !G.hint;
  if (G.hint) {
    if (G.over) ev.innerHTML = T.evOver;
    else if (!myTurn) ev.innerHTML = T.evWait;
    else if (G.value === null) ev.innerHTML = T.evCalc;
    else ev.innerHTML = T.evNow(G.value * hs);
  }

  // log
  $("log").dataset.empty = T.noMoves;
  $("log").innerHTML = G.log.map((x) => `<li${x.pass ? ' class="pass"' : ""}>${logText(x)}</li>`).join("");
  $("log").scrollTop = $("log").scrollHeight;

  // rules
  const R = RULETEXT[G.lang][G.rule];
  $("rules-title").textContent = T.rulesHead(R.title);
  $("rules-list").innerHTML = R.rules.map((r) => `<li>${r}</li>`).join("");
  $("verdict").innerHTML = `<span>${T.solved}</span><b>${R.verdict}</b>`;
  $("facts").textContent = R.facts;
}

function drawWinLine() {
  const svg = $("winline"), board = $("board");
  if (!svg || !G.over || !G.over.line) return;
  const W = board.clientWidth, H = board.clientHeight;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("width", W); svg.setAttribute("height", H);
  const cells = board.querySelectorAll(".cell");
  const c = (i) => { const el = cells[i]; return [el.offsetLeft + el.offsetWidth / 2, el.offsetTop + el.offsetHeight / 2]; };
  const [a, , z] = G.over.line;
  const [x1, y1] = c(a), [x2, y2] = c(z);
  svg.innerHTML = `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"></line>`;
}

function applyLang() {
  T = I18N[G.lang];
  document.documentElement.lang = T.htmlLang;
  document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = T[el.dataset.i18n]; });
  document.querySelectorAll("[data-i18n-aria]").forEach((el) => { el.setAttribute("aria-label", T[el.dataset.i18nAria]); });
  const b = $("btn-lang");
  b.textContent = T.other; b.setAttribute("aria-label", T.otherAria);
}

/* ---------- wiring ---------- */
function start(data) {
  loadPrefs();
  if (!G.lang) G.lang = /^zh/i.test(navigator.language || "") ? "zh" : "en";
  if (data && I18N[data.lang]) G.lang = data.lang;
  applyLang();
  $("btn-lang").addEventListener("click", () => { G.lang = G.lang === "zh" ? "en" : "zh"; savePrefs(); applyLang(); render(); });
  E = makeEngine(RULESETS[G.rule].cfg);
  $("board").addEventListener("click", (e) => {
    const cell = e.target.closest(".cell");
    if (cell) onCell(+cell.dataset.i);
  });
  document.querySelectorAll('input[name="rule"]').forEach((el) => el.addEventListener("change", () => { G.rule = el.value; savePrefs(); newGame(); }));
  document.querySelectorAll('input[name="side"]').forEach((el) => el.addEventListener("change", () => { G.human = +el.value; savePrefs(); newGame(); }));
  $("hint-toggle").addEventListener("change", (e) => { G.hint = e.target.checked; savePrefs(); G.hints = null; G.value = null; render(); if (G.hint) scheduleNext(); });
  $("btn-new").addEventListener("click", newGame);
  $("btn-undo").addEventListener("click", undo);
  window.addEventListener("resize", drawWinLine);
  if (data && data.st && RULESETS[data.rule]) {
    Object.assign(G, { rule: data.rule, human: data.human, hint: data.hint, st: data.st, log: data.log || [], history: data.history || [], over: data.over || null, last: data.last ?? null });
    E = makeEngine(RULESETS[G.rule].cfg);
    render();
    scheduleNext();
  } else newGame();
  // warm the solver so the first answer is instant
  Solver.ask(RULESETS[G.rule].cfg, "eval", emptyState());
}
window.claude?.hot?.snapshot?.(() => ({ lang: G.lang, rule: G.rule, human: G.human, hint: G.hint, st: G.st, log: G.log, history: G.history, over: G.over, last: G.last }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>

</html>
